[package]
name = "kova-sdk"
version = "0.1.0"
edition = "2024"
description = "Async-first Rust library for building LLM-powered agents with tool calling, streaming, MCP, and multi-agent orchestration"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/0xAMC/kova"
homepage = "https://github.com/0xAMC/kova"
documentation = "https://docs.rs/kova-sdk"
keywords = ["llm", "agent", "ai", "mcp", "openai"]
categories = ["api-bindings", "asynchronous", "web-programming"]

[dependencies]
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
bytes = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3.32"
thiserror = "2.0.18"
async-trait = "0.1.89"
tracing = "0.1.44"
pin-project-lite = "0.2.17"
aws-sigv4 = "1.4"
aws-credential-types = { version = "1.2", features = ["hardcoded-credentials"] }
aws-config = "1.8"
aws-smithy-runtime-api = "1.12"
aws-smithy-eventstream = "0.60.20"
aws-smithy-types = "1.4"
http = "1.4"

[features]
telemetry = ["dep:tracing-opentelemetry", "dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:opentelemetry-stdout"]

[dependencies.tracing-subscriber]
version = "0.3.23"
features = ["env-filter"]

[dependencies.tracing-opentelemetry]
version = "0.33"
optional = true

[dependencies.opentelemetry]
version = "0.32"
optional = true

[dependencies.opentelemetry_sdk]
version = "0.32"
features = ["rt-tokio", "trace"]
optional = true

[dependencies.opentelemetry-otlp]
version = "0.32"
features = ["grpc-tonic", "http-proto"]
optional = true

[dependencies.opentelemetry-stdout]
version = "0.32"
features = ["trace"]
optional = true

[dev-dependencies]
proptest = "1.11"
wiremock = "0.6.5"
tokio-test = "0.4.5"
tracing-test = { version = "0.2.6", features = ["no-env-filter"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "registry"] }
