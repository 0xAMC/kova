[package]
name = "kova-sdk"
version = "0.8.0"
edition = "2024"
description = "Async-first Rust library for building LLM-powered agents with tool calling, streaming, MCP, and multi-agent orchestration"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/0xAMC/kova"
homepage = "https://github.com/0xAMC/kova"
documentation = "https://docs.rs/kova-sdk"
keywords = ["llm", "agent", "ai", "mcp", "openai"]
categories = ["api-bindings", "asynchronous", "web-programming"]

[dependencies]
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util"] }
tokio-util = "0.7"
reqwest = { version = "0.13", features = ["json", "stream"] }
bytes = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3.32"
thiserror = "2.0.18"
async-trait = "0.1.89"
tracing = "0.1.44"
pin-project-lite = "0.2.17"
async-stream = "0.3"
aws-sigv4 = { version = "1.4", optional = true }
aws-credential-types = { version = "1.2", features = ["hardcoded-credentials"], optional = true }
aws-config = { version = "1.8", optional = true }
aws-smithy-runtime-api = { version = "1.12", optional = true }
aws-smithy-eventstream = { version = "0.60.20", optional = true }
aws-smithy-types = { version = "1.4", optional = true }
http = { version = "1.4", optional = true }

# Built-in tools (opt-in to keep the core dependency-light).
glob = { version = "0.3", optional = true }
regex = { version = "1", optional = true }
diffy = { version = "0.3", optional = true }
scraper = { version = "0.27", optional = true }
dom_smoothie = { version = "0.18", optional = true }
htmd = { version = "0.5", optional = true }

[features]
default = ["openai", "gemini", "ollama", "bedrock", "anthropic"]
openai = []
anthropic = []
gemini = []
ollama = []
# Filesystem and shell tools (read_file, list_dir, search, edit_file,
# write_file, patch_file, shell). Light dependencies only.
tools = ["dep:glob", "dep:regex", "dep:diffy"]
# Network tools (fetch_webpage, web_search). Pulls in an HTML parser and
# readability extraction; enables tokio's DNS resolver for SSRF guarding.
web-tools = ["tools", "dep:scraper", "dep:dom_smoothie", "dep:htmd", "tokio/net"]
bedrock = [
    "dep:aws-sigv4",
    "dep:aws-credential-types",
    "dep:aws-config",
    "dep:aws-smithy-runtime-api",
    "dep:aws-smithy-eventstream",
    "dep:aws-smithy-types",
    "dep:http",
]
telemetry = ["dep:tracing-opentelemetry", "dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:opentelemetry-stdout"]

[dependencies.tracing-subscriber]
version = "0.3.23"
features = ["env-filter"]

[dependencies.tracing-opentelemetry]
version = "0.33"
optional = true

[dependencies.opentelemetry]
version = "0.32"
optional = true

[dependencies.opentelemetry_sdk]
version = "0.32"
features = ["rt-tokio", "trace"]
optional = true

[dependencies.opentelemetry-otlp]
version = "0.32"
features = ["grpc-tonic", "http-proto"]
optional = true

[dependencies.opentelemetry-stdout]
version = "0.32"
features = ["trace"]
optional = true

[dev-dependencies]
proptest = "1.11"
wiremock = "0.6.5"
tokio-test = "0.4.5"
tempfile = "3"
tracing-test = { version = "0.2.6", features = ["no-env-filter"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "registry"] }
